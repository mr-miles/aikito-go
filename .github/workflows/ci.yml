name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Pushes and PRs run Linux only. macOS, Windows and the race detector run
  # only when started by hand (Actions tab > CI > Run workflow), with a
  # checkbox for each.
  workflow_dispatch:
    inputs:
      macos:
        description: Also build and test on macOS
        type: boolean
        default: true
      windows:
        description: Also build and test on Windows
        type: boolean
        default: true
      race:
        description: Run tests with the race detector (Linux)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(format('["ubuntu-latest"{0}{1}]', inputs.macos && ',"macos-latest"' || '', inputs.windows && ',"windows-latest"' || '')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: E2E tests (against committed golden fixtures, no Python needed)
        run: go test -tags e2e ./e2e/...

      - name: Build CLI binary
        run: go build -o aikito${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/aikito

      - name: Smoke test the binary
        shell: bash
        run: |
          ./aikito${{ runner.os == 'Windows' && '.exe' || '' }} version
          tmp=$(mktemp -d)
          # os.UserHomeDir() reads $HOME on Linux/macOS but %USERPROFILE% on
          # Windows; set both so this is an isolated temp home everywhere.
          HOME="$tmp" USERPROFILE="$tmp" ./aikito${{ runner.os == 'Windows' && '.exe' || '' }} init workspace

  race:
    name: Test with -race (Linux, cgo)
    if: github.event_name == 'workflow_dispatch' && inputs.race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race ./...

# Note: the e2e suite (./e2e, tag "e2e") compares the Go binary against
# golden fixtures captured from the reference Python implementation
# (lsaint/aikito). Those fixtures are committed under e2e/testdata/ and
# regenerated manually/occasionally — CI never needs Python at all. See
# e2e/README.md for how to regenerate them after an intentional behavior
# change.
