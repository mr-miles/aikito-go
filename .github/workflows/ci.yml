name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build CLI binary
        run: go build -o aikito${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/aikito

      - name: Smoke test the binary
        shell: bash
        run: |
          ./aikito${{ runner.os == 'Windows' && '.exe' || '' }} version
          tmp=$(mktemp -d)
          # os.UserHomeDir() reads $HOME on Linux/macOS but %USERPROFILE% on
          # Windows; set both so this is an isolated temp home everywhere.
          HOME="$tmp" USERPROFILE="$tmp" ./aikito${{ runner.os == 'Windows' && '.exe' || '' }} init workspace

  race:
    name: Test with -race (Linux, cgo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race ./...

  e2e-vs-python:
    name: E2E vs. reference Python implementation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Go port
        uses: actions/checkout@v4
        with:
          path: code

      - name: Checkout reference Python implementation
        uses: actions/checkout@v4
        with:
          repository: lsaint/aikito
          path: aikito-python

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run e2e comparison suite
        working-directory: code
        env:
          AIKITO_PYTHON_SRC: ${{ github.workspace }}/aikito-python/src
        run: go test -tags e2e ./e2e/...
